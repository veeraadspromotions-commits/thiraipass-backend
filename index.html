<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ThiraiPass - நேரலை திரைப்பட முன்பதிவு</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; padding-bottom: 80px; }
    
    /* Header */
    header { background: #1e293b; padding: 12px 14px; border-bottom: 1px solid #334155; position: sticky; top: 0; z-index: 10; }
    .header-top { display: flex; justify-content: space-between; align-items: center; }
    .logo { font-size: 20px; font-weight: bold; color: #ef4444; }
    .header-actions { display: flex; gap: 8px; margin-top: 10px; }
    
    .admin-link { background: #ef4444; color: white; text-decoration: none; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: bold; display: inline-block; }
    .scanner-link { background: #22c55e; color: #000; text-decoration: none; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: bold; display: inline-block; }
    .city-select { background: #334155; color: #38bdf8; border: 1px solid #475569; padding: 6px 10px; border-radius: 16px; font-size: 12px; font-weight: bold; outline: none; }

    /* Location Bar */
    .container { padding: 16px; }
    .location-banner { background: #1e293b; padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; display: flex; align-items: center; justify-content: space-between; border-left: 4px solid #22c55e; }
    .detect-btn { background: #22c55e; color: #0f172a; border: none; padding: 6px 10px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; }

    h2 { font-size: 17px; margin-bottom: 12px; color: #e2e8f0; }
    .movie-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
    .movie-card { background: #1e293b; border-radius: 12px; overflow: hidden; border: 1px solid #334155; cursor: pointer; }
    .movie-card img { width: 100%; height: 210px; object-fit: cover; }
    .movie-info { padding: 10px; }
    .movie-title { font-size: 15px; font-weight: 600; }
    .movie-meta { font-size: 12px; color: #94a3b8; margin-top: 4px; }

    /* Modal Sheet */
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 20; justify-content: flex-end; }
    .modal-content { background: #1e293b; width: 100%; max-height: 85vh; border-radius: 20px 20px 0 0; padding: 20px; overflow-y: auto; }
    .close-btn { float: right; font-size: 22px; cursor: pointer; color: #94a3b8; }
    
    .theatre-card { background: #0f172a; padding: 14px; border-radius: 10px; margin-top: 12px; border: 1px solid #334155; }
    .show-btn { background: #334155; border: 1px solid #22c55e; color: #22c55e; padding: 6px 14px; border-radius: 6px; margin: 8px 6px 0 0; font-size: 13px; font-weight: bold; cursor: pointer; }
    .show-btn:hover { background: #22c55e; color: #000; }

    /* Seats Layout */
    .screen-container { margin: 20px 0; text-align: center; }
    .screen { height: 6px; background: #38bdf8; border-radius: 4px; box-shadow: 0 4px 12px rgba(56, 189, 248, 0.4); margin-bottom: 20px; }
    .seats-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; max-width: 320px; margin: 0 auto; }
    .seat { height: 38px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; cursor: pointer; }
    .seat.available { background: #334155; color: #f8fafc; border: 1px solid #475569; }
    .seat.selected { background: #22c55e !important; color: #000 !important; }
    .seat.booked { background: #dc2626 !important; color: #7f1d1d !important; cursor: not-allowed; }

    /* Checkout Bar */
    .checkout-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #1e293b; padding: 14px 20px; border-top: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
    .book-btn { background: #ef4444; color: white; border: none; padding: 10px 22px; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer; }

    .ticket { background: #0f172a; border: 2px dashed #22c55e; padding: 20px; border-radius: 12px; text-align: center; margin-top: 20px; }
    .qr-box { margin: 15px auto; width: 120px; height: 120px; background: white; color: black; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: bold; }
  </style>
</head>
<body>

  <header>
    <div class="header-top">
      <div class="logo">🎟️ ThiraiPass</div>
      <select class="city-select" id="cityDropdown" onchange="changeCity(this.value)">
        <option value="Tirunelveli">📍 திருநெல்வேலி</option>
        <option value="Chennai">📍 சென்னை</option>
        <option value="Coimbatore">📍 கோவை</option>
        <option value="Madurai">📍 மதுரை</option>
      </select>
    </div>
    
    <!-- நேரடி அட்மின் பட்டன்கள் -->
    <div class="header-actions">
      <a href="admin.html" class="admin-link">👔 மேனேஜர் அட்மின்</a>
      <a href="scanner.html" class="scanner-link">🔍 கேட் டிக்கெட் செக்கர்</a>
    </div>
  </header>

  <div class="container">
    <div class="location-banner">
      <span id="locationText">இருப்பிடம்: திருநெல்வேலி</span>
      <button class="detect-btn" onclick="detectRealGPS()">📡 GPS கண்டறி</button>
    </div>

    <h2>சமீபத்திய வெளியீடுகள் (Now Showing)</h2>
    <div class="movie-grid" id="moviesList"></div>
  </div>

  <!-- Booking Modal -->
  <div class="modal" id="bookingModal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal()">✕</span>
      <h3 id="modalMovieTitle">திரைப்படம்</h3>
      <p id="modalMovieMeta" style="color:#94a3b8; font-size: 13px; margin-bottom: 12px;"></p>

      <div id="theatreSection">
        <h4 style="margin-top:10px;"><span id="theatreCityLabel">திருநெல்வேலி</span> திரையரங்குகள்:</h4>
        <div id="theatresList"></div>
      </div>

      <div id="seatSection" style="display:none; margin-top: 20px;">
        <h4>இருக்கையைத் தேர்ந்தெடுக்கவும்:</h4>
        <div class="screen-container">
          <div class="screen"></div>
          <small style="color: #64748b;">திரை (Screen நோக்கி)</small>
        </div>
        <div class="seats-grid" id="seatsGrid"></div>
      </div>

      <div id="ticketResult" style="display:none;"></div>
    </div>
  </div>

  <div class="checkout-bar" id="checkoutBar" style="display:none;">
    <div>
      <div style="font-size: 12px; color: #94a3b8;">இருக்கைகள்: <span id="selectedSeatsLabel" style="color:#fff;">0</span></div>
      <div style="font-size: 16px; font-weight: bold; color: #22c55e;">₹<span id="totalAmount">0</span></div>
    </div>
    <button class="book-btn" onclick="confirmBooking()">முன்பதிவு செய்</button>
  </div>

  <script>
    const cityTheatres = {
      "Tirunelveli": [
        { name: "ராம் முத்துராம் சினிமாஸ் (Ram Muthuram)", loc: "வண்ணார்பேட்டை", shows: ["10:30 AM", "02:15 PM", "06:30 PM", "10:15 PM"] },
        { name: "பெரின்ப விலாஸ் (PV Multiplex)", loc: "திருநெல்வேலி ஜங்ஷன்", shows: ["11:00 AM", "02:45 PM", "06:45 PM", "10:00 PM"] },
        { name: "ரத்னா தியேட்டர் (Ratna Multiplex)", loc: "வண்ணார்பேட்டை", shows: ["10:45 AM", "02:30 PM", "06:15 PM"] }
      ],
      "Chennai": [
        { name: "SPI Cinemas (சத்யம்)", loc: "ராயப்பேட்டை", shows: ["10:30 AM", "02:15 PM", "06:45 PM"] },
        { name: "ரோகிணி சில்வர் ஸ்கிரீன்ஸ்", loc: "கோயம்பேடு", shows: ["11:00 AM", "02:30 PM", "06:30 PM"] }
      ],
      "Coimbatore": [
        { name: "Broadway Cinemas", loc: "அவினாசி ரோடு", shows: ["10:45 AM", "02:30 PM", "06:15 PM"] }
      ],
      "Madurai": [
        { name: "Vetri Cinemas", loc: "வில்லாபுரம்", shows: ["11:00 AM", "02:30 PM", "06:30 PM"] }
      ]
    };

    const latestMovies = [
      { id: 1, title: "அமரன் (Amaran)", language: "தமிழ்", genre: "Biographical Action", duration: "2h 49m", poster: "https://images.unsplash.com/photo-1518676590629-3dcbd9c5a5c9?w=500" },
      { id: 2, title: "GOAT (The Greatest Of All Time)", language: "தமிழ்", genre: "Sci-Fi Action", duration: "3h 03m", poster: "https://images.unsplash.com/photo-1574267432553-4b4628081c31?w=500" },
      { id: 3, title: "லியோ (Leo)", language: "தமிழ்", genre: "Action / Thriller", duration: "2h 44m", poster: "https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=500" },
      { id: 4, title: "ஜெயிலர் (Jailer)", language: "தமிழ்", genre: "Action / Drama", duration: "2h 48m", poster: "https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=500" }
    ];

    let currentCity = "Tirunelveli";
    let selectedMovie = null;
    let selectedSeats = [];
    const ticketPrice = 190;

    async function detectRealGPS() {
      const locText = document.getElementById("locationText");
      locText.innerText = "GPS செயற்கைக்கோள் தேடுகிறது...";

      if (!navigator.geolocation) {
        locText.innerText = "GPS வசதி பிரவுசரில் இல்லை.";
        return;
      }

      navigator.geolocation.getCurrentPosition(
        async (position) => {
          const lat = position.coords.latitude;
          const lon = position.coords.longitude;
          try {
            const response = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=en`);
            const data = await response.json();
            let detectedCity = data.city || data.locality || "Tirunelveli";
            locText.innerText = `இருப்பிடம்: ${detectedCity} (GPS உறுதிசெய்யப்பட்டது ✅)`;
            changeCity(detectedCity);
          } catch (e) {
            locText.innerText = "இருப்பிடம்: திருநெல்வேலி (GPS உறுதிசெய்யப்பட்டது ✅)";
            changeCity("Tirunelveli");
          }
        },
        () => {
          locText.innerText = "GPS அனுமதி மறுக்கப்பட்டது. திருநெல்வேலி தேர்வு செய்யப்பட்டுள்ளது.";
          changeCity("Tirunelveli");
        }
      );
    }

    function changeCity(city) {
      currentCity = city;
      document.getElementById("locationText").innerText = `இருப்பிடம்: ${city}`;
      document.getElementById("theatreCityLabel").innerText = city;
    }

    function loadMovies() {
      const container = document.getElementById("moviesList");
      container.innerHTML = "";
      latestMovies.forEach(m => {
        container.innerHTML += `
          <div class="movie-card" onclick="openShows(${m.id})">
            <img src="${m.poster}" alt="${m.title}">
            <div class="movie-info">
              <div class="movie-title">${m.title}</div>
              <div class="movie-meta">${m.language} • ${m.duration}</div>
            </div>
          </div>
        `;
      });
    }

    function openShows(movieId) {
      selectedMovie = latestMovies.find(m => m.id === movieId);
      document.getElementById("modalMovieTitle").innerText = selectedMovie.title;
      document.getElementById("modalMovieMeta").innerText = `${selectedMovie.genre} | ${selectedMovie.duration}`;
      document.getElementById("theatreCityLabel").innerText = currentCity;
      
      const theatres = cityTheatres[currentCity] || cityTheatres["Tirunelveli"];
      const theatresContainer = document.getElementById("theatresList");
      theatresContainer.innerHTML = "";

      theatres.forEach(t => {
        let buttons = t.shows.map(s => `<button class="show-btn" onclick="selectShow('${t.name}', '${s}')">${s}</button>`).join("");
        theatresContainer.innerHTML += `
          <div class="theatre-card">
            <strong>${t.name}</strong> - <small style="color:#94a3b8;">${t.loc}</small>
            <div style="margin-top:6px;">${buttons}</div>
          </div>
        `;
      });

      document.getElementById("theatreSection").style.display = "block";
      document.getElementById("seatSection").style.display = "none";
      document.getElementById("ticketResult").style.display = "none";
      document.getElementById("bookingModal").style.display = "flex";
    }

    function selectShow(theatreName, time) {
      document.getElementById("theatreSection").style.display = "none";
      document.getElementById("seatSection").style.display = "block";
      document.getElementById("checkoutBar").style.display = "flex";

      const grid = document.getElementById("seatsGrid");
      grid.innerHTML = "";
      selectedSeats = [];
      updateCheckout();

      const seatCodes = ["A1","A2","A3","A4","A5","A6","B1","B2","B3","B4","B5","B6","C1","C2","C3","C4","C5","C6"];
      const booked = ["A2", "A3", "B4", "C1"];

      seatCodes.forEach(code => {
        const isBooked = booked.includes(code);
        const div = document.createElement("div");
        div.className = `seat ${isBooked ? 'booked' : 'available'}`;
        div.innerText = code;
        if (!isBooked) {
          div.onclick = () => toggleSeat(code, div);
        }
        grid.appendChild(div);
      });
    }

    function toggleSeat(code, element) {
      if (selectedSeats.includes(code)) {
        selectedSeats = selectedSeats.filter(s => s !== code);
        element.classList.remove("selected");
      } else {
        selectedSeats.push(code);
        element.classList.add("selected");
      }
      updateCheckout();
    }

    function updateCheckout() {
      document.getElementById("selectedSeatsLabel").innerText = selectedSeats.join(", ") || "ஏதுமில்லை";
      document.getElementById("totalAmount").innerText = selectedSeats.length * ticketPrice;
    }

    function confirmBooking() {
      if (selectedSeats.length === 0) {
        alert("இருக்கையைத் தேர்ந்தெடுக்கவும்!");
        return;
      }
      const bookingId = "TP" + Math.floor(100000 + Math.random() * 900000);
      document.getElementById("seatSection").style.display = "none";
      document.getElementById("checkoutBar").style.display = "none";
      
      const ticketResult = document.getElementById("ticketResult");
      ticketResult.style.display = "block";
      ticketResult.innerHTML = `
        <div class="ticket">
          <h3 style="color:#22c55e;">🎉 முன்பதிவு உறுதியானது!</h3>
          <p style="margin-top:8px;"><strong>படம்:</strong> ${selectedMovie.title}</p>
          <p><strong>ஊர்:</strong> ${currentCity}</p>
          <p><strong>இருக்கைகள்:</strong> ${selectedSeats.join(', ')}</p>
          <p><strong>செலுத்திய தொகை:</strong> ₹${selectedSeats.length * ticketPrice}</p>
          <div class="qr-box">QR TICKET<br>${bookingId}</div>
          <small style="color:#94a3b8;">தியேட்டர் வாசலில் இதைக் காட்டவும்</small>
        </div>
      `;
    }

    function closeModal() {
      document.getElementById("bookingModal").style.display = "none";
      document.getElementById("checkoutBar").style.display = "none";
    }

    loadMovies();
  </script>
</body>
</html>
